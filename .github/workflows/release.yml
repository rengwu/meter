name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify version and tests
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
          test -f "docs/releases/${GITHUB_REF_NAME#v}.md"
          swift run UsageCoreTests
          command -v jq >/dev/null || brew install jq
          bash tap/test_tap.sh

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          ./build.sh "$version"
          for architecture in arm64 x86_64; do
            lipo build/Meter.app/Contents/MacOS/Meter -verify_arch "$architecture"
          done

      - name: Build DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Meter" \
            --window-size 500 320 \
            --icon-size 100 \
            --icon "Meter.app" 125 160 \
            --app-drop-link 375 160 \
            --no-internet-enable \
            "build/Meter-${GITHUB_REF_NAME}.dmg" \
            "build/Meter.app"
          # Stable download name across Meter releases.
          cp "build/Meter-${GITHUB_REF_NAME}.dmg" "build/Meter.dmg"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ env.RELEASE_VERSION }}.md
          files: |
            build/Meter-*.dmg
            build/Meter.dmg
          generate_release_notes: true
